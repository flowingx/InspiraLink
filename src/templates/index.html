<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵息 InspiraLink</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root{--bg:#f3f6f8;--panel:#fff;--ink:#172026;--muted:#64727d;--line:#d7e0e7;--accent:#007c89;--accent-2:#c2542d;--ok:#1f8a5b;--warn:#b46a00;--bad:#b42318}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif}
        header{border-bottom:1px solid var(--line);background:#fff}
        .topbar{width:min(1280px,calc(100vw - 32px));margin:0 auto;padding:18px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
        h1{margin:0;font-size:24px;font-weight:700}
        .subtitle{margin-top:6px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
    <header>
        <div class="topbar">
            <div>
                <h1>灵息 InspiraLink</h1>
                <div class="subtitle" id="subtitleText">黑夜模式：呼吸监测 + 血氧 + 气囊辅助</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
                <span style="font-size:13px;color:var(--muted)">白天</span>
                <label style="position:relative;display:inline-block;width:50px;height:26px">
                    <input type="checkbox" id="modeToggle" style="opacity:0;width:0;height:0">
                    <span id="toggleSlider" style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:26px;transition:.3s"></span>
                </label>
                <span style="font-size:13px;color:var(--muted)">黑夜</span>
            </div>
        </div>
    </header>
<!-- PLACEHOLDER_MAIN -->

    <main style="width:min(1280px,calc(100vw - 32px));margin:18px auto 28px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px">
        <!-- ===== NIGHT MODE PANELS ===== -->
        <section id="nightSection">
            <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px" class="cards">
                <div class="metric"><label>压差</label><strong id="deltaValue">--</strong><span id="thresholdValue">阈值 -- Pa</span></div>
                <div class="metric"><label>呼吸状态</label><strong id="breathState">--</strong><span id="lastBreathValue">距上次 -- s</span></div>
                <div class="metric"><label>AHT20 温湿度</label><strong id="environmentValue">--</strong><span id="environmentActivity">--</span></div>
                <div class="metric"><label>SpO2</label><strong id="spo2Value">--</strong><span id="hrValue">心率 --</span></div>
                <div class="metric"><label>舵机</label><strong id="servoState">--</strong><span id="pumpCountValue">手动测试 0 次</span></div>
            </div>
            <div style="background:#fff;border:1px solid var(--line);border-radius:8px;min-height:460px">
                <div style="min-height:44px;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px">
                    <h2 style="margin:0;font-size:15px;font-weight:700">BMP280 压差波形</h2>
                    <div id="alarmBadge" style="display:inline-flex;align-items:center;min-height:28px;border-radius:999px;padding:4px 10px;font-size:13px;border:1px solid rgba(31,138,91,.35);background:rgba(31,138,91,.08);color:var(--ok)">无报警</div>
                </div>
                <div style="padding:14px">
                    <div id="pressureChart" style="width:100%;height:390px"></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                        <div id="pressureValue" style="padding:4px 10px;font-size:13px;border:1px solid var(--line);border-radius:999px;background:#f8fafb">当前气压 -- Pa</div>
                        <div id="baselineValue" style="padding:4px 10px;font-size:13px;border:1px solid var(--line);border-radius:999px;background:#f8fafb">基准气压 -- Pa</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== DAY MODE PANELS ===== -->
        <section id="daySection" style="display:none">
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px" class="cards">
                <div class="metric"><label>跌倒状态</label><strong id="fallStatus">--</strong><span id="fallAngle">角度 --</span></div>
                <div class="metric"><label>报警</label><strong id="fallAlarm">正常</strong><span id="fallCount">连续帧 0</span></div>
                <div class="metric"><label>摄像头</label><strong id="cameraStatus">--</strong><span>YOLOv8n-pose</span></div>
            </div>
            <div style="background:#fff;border:1px solid var(--line);border-radius:8px;min-height:460px;overflow:hidden">
                <div style="min-height:44px;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px">
                    <h2 style="margin:0;font-size:15px;font-weight:700">摄像头实时画面</h2>
                    <div style="color:var(--muted);font-size:13px">YOLOv8n-pose 跌倒检测</div>
                </div>
                <div style="padding:14px">
                    <div style="background:#0f171b;border-radius:8px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden">
                        <img id="cameraFeed" alt="摄像头实时画面" style="width:100%;height:100%;object-fit:contain;display:block">
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== SIDEBAR (shared) ===== -->
        <aside style="display:flex;flex-direction:column;gap:16px;min-width:0">
            <div style="background:#fff;border:1px solid var(--line);border-radius:8px">
                <div style="padding:12px 14px;border-bottom:1px solid var(--line)"><h2 style="margin:0;font-size:15px;font-weight:700">控制与参数</h2></div>
                <div style="padding:14px">
                    <div id="nightControls" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                        <div class="field"><label>活动阈值 Pa</label><input id="min_breath_activity_pa" type="number" step="0.5"></div>
                        <div class="field"><label>湿度上升阈值 %</label><input id="humidity_activity_threshold" type="number" step="0.1"></div>
                        <div class="field"><label>温度上升阈值 C</label><input id="temperature_activity_threshold" type="number" step="0.01"></div>
                        <div class="field"><label>冷却时间 s</label><input id="cooldown_seconds" type="number" step="0.1"></div>
                        <div class="field"><label>暂停最短 s</label><input id="apnea_min_seconds" type="number" step="0.5"></div>
                        <div class="field"><label>暂停上限 s</label><input id="apnea_max_seconds" type="number" step="0.5" max="15"></div>
                        <div class="field"><label>泵气间隔 s</label><input id="assist_interval_seconds" type="number" step="0.5"></div>
                        <div class="field"><label>SpO2 报警阈值 %</label><input id="spo2_alarm_threshold" type="number" step="1"></div>
                        <div class="field"><label>血氧恢复保持 s</label><input id="spo2_recovery_hold_seconds" type="number" step="0.5"></div>
                        <div class="field"><label>泵气无效上限</label><input id="spo2_pump_max_count" type="number" step="1"></div>
                        <div class="field"><label>舵机复位角</label><input id="servo_rest_angle" type="number" step="1"></div>
                        <div class="field"><label>舵机压下角</label><input id="servo_press_angle" type="number" step="1"></div>
                        <div class="field"><label>舵机复位值</label><input id="servo_rest_value" type="number" step="0.1"></div>
                        <div class="field"><label>舵机压下值</label><input id="servo_press_value" type="number" step="0.1"></div>
                        <div class="field"><label>压下停留 s</label><input id="pump_hold_seconds" type="number" step="0.1"></div>
                        <div class="field"><label>复位停留 s</label><input id="servo_rest_seconds" type="number" step="0.1"></div>
                        <div class="field"><label>泵后屏蔽 s</label><input id="pump_artifact_ignore_seconds" type="number" step="0.1"></div>
                    </div>
                    <div id="dayControls" style="display:none;grid-template-columns:1fr 1fr;gap:10px">
                        <div class="field"><label>跌倒角度阈值</label><input id="fall_angle_threshold" type="number" step="1"></div>
                        <div class="field"><label>确认帧数</label><input id="fall_detect_frames" type="number" step="1"></div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
                        <button id="saveConfig" style="height:36px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer">保存参数</button>
                        <button id="calibrate" style="height:36px;border:1px solid var(--accent);border-radius:6px;background:#fff;color:var(--accent);font-weight:700;cursor:pointer">重新校准</button>
                        <button id="pumpTest" style="height:36px;border:1px solid var(--accent-2);border-radius:6px;background:var(--accent-2);color:#fff;font-weight:700;cursor:pointer">手动泵气测试</button>
                        <button id="ledTest" style="height:36px;border:1px solid var(--accent);border-radius:6px;background:#fff;color:var(--accent);font-weight:700;cursor:pointer">LED 测试</button>
                    </div>
                </div>
            </div>
            <div style="background:#fff;border:1px solid var(--line);border-radius:8px">
                <div style="padding:12px 14px;border-bottom:1px solid var(--line)"><h2 style="margin:0;font-size:15px;font-weight:700">硬件连接</h2></div>
                <div style="padding:14px"><div id="hardwareList" style="display:grid;gap:7px;color:var(--muted);font-size:13px"></div></div>
            </div>
            <div style="background:#fff;border:1px solid var(--line);border-radius:8px">
                <div style="padding:12px 14px;border-bottom:1px solid var(--line)"><h2 style="margin:0;font-size:15px;font-weight:700">事件日志</h2></div>
                <div style="padding:14px"><div class="logs" id="logs" style="max-height:250px;overflow:auto;display:flex;flex-direction:column;gap:8px"></div></div>
            </div>
        </aside>
    </main>

    <style>
        .metric{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:92px}
        .metric label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
        .metric strong{display:block;font-size:22px;line-height:1.1}
        .metric span{display:block;margin-top:5px;color:var(--muted);font-size:12px}
        .field{display:flex;flex-direction:column;gap:5px}
        .field label{color:var(--muted);font-size:12px}
        input{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;background:#fff;color:var(--ink)}
        .log-item{border-left:3px solid var(--line);padding:2px 0 2px 9px;font-size:13px}
        .log-item.warning{border-left-color:var(--warn)}
        .log-item.error{border-left-color:var(--bad)}
        .log-time{color:var(--muted);font-size:11px;margin-bottom:2px}
        #toggleSlider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
        #modeToggle:checked + #toggleSlider{background:var(--accent)}
        #modeToggle:checked + #toggleSlider:before{transform:translateX(24px)}
        @media(max-width:980px){main{grid-template-columns:1fr!important}.cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
    </style>

    <script>
        const chart = echarts.init(document.getElementById('pressureChart'));
        const nightFields = ['min_breath_activity_pa','humidity_activity_threshold','temperature_activity_threshold','cooldown_seconds','apnea_min_seconds','apnea_max_seconds','assist_interval_seconds','spo2_alarm_threshold','spo2_recovery_hold_seconds','spo2_pump_max_count','servo_rest_angle','servo_press_angle','servo_rest_value','servo_press_value','pump_hold_seconds','servo_rest_seconds','pump_artifact_ignore_seconds'];
        const dayFields = ['fall_angle_threshold','fall_detect_frames'];
        const allFields = nightFields.concat(dayFields);

        let currentMode = 'night';

        chart.setOption({animation:false,tooltip:{trigger:'axis'},grid:{left:54,right:20,top:24,bottom:42},xAxis:{type:'category',boundaryGap:false,data:[]},yAxis:{type:'value',name:'Pa'},series:[{name:'压差',type:'line',data:[],smooth:true,showSymbol:false,lineStyle:{color:'#007c89',width:2},areaStyle:{color:'rgba(0,124,137,.10)'},markLine:{silent:true,symbol:'none',data:[]}}]});

        function fmt(v,d=1){return v==null?'--':Number(v).toFixed(d)}

        function renderHardware(hw){
            const pins=hw.gpio_pins||{};
            document.getElementById('hardwareList').innerHTML=`
                <div><strong>压力传感器：</strong>${hw.pressure_sensor}</div>
                <div><strong>温湿度：</strong>${hw.environment_sensor||'--'}</div>
                <div><strong>MAX30102：</strong>${hw.pulse_oximeter||'--'}</div>
                <div><strong>跌倒检测：</strong>${hw.fall_detector||'--'}</div>
                <div><strong>舵机：</strong>${hw.servo}</div>
                <div><strong>LED：</strong>${hw.led}</div>
                <div><strong>GPIO：</strong>LED ${pins.led}, Servo ${pins.servo}, SDA ${pins.i2c_sda}, SCL ${pins.i2c_scl}</div>`;
        }

        function renderLogs(events){
            const logs=document.getElementById('logs');
            const rows=(events||[]).slice(-24).reverse().map(item=>{
                const t=new Date(item.ts*1000).toLocaleTimeString();
                return `<div class="log-item ${item.level}"><div class="log-time">${t} · ${item.kind}</div><div>${item.message}</div></div>`;
            });
            logs.innerHTML=rows.join('')||'<div class="log-item"><div>暂无事件</div></div>';
        }

        function renderData(data){
            currentMode=data.system_mode||'night';
            document.getElementById('modeToggle').checked=(currentMode==='night');
            document.getElementById('subtitleText').textContent=currentMode==='night'?'黑夜模式：呼吸监测 + 血氧 + 气囊辅助':'白天模式：跌倒检测';
            document.getElementById('nightSection').style.display=currentMode==='night'?'':'none';
            document.getElementById('daySection').style.display=currentMode==='day'?'':'none';
            document.getElementById('nightControls').style.display=currentMode==='night'?'grid':'none';
            document.getElementById('dayControls').style.display=currentMode==='day'?'grid':'none';
            const cameraFeed=document.getElementById('cameraFeed');
            if(cameraFeed){
                if(currentMode==='day'&&!cameraFeed.src){cameraFeed.src='/camera_feed?t='+Date.now();}
                if(currentMode!=='day'&&cameraFeed.src){cameraFeed.removeAttribute('src');}
            }

            if(currentMode==='night'){
                document.getElementById('deltaValue').textContent=`${fmt(data.delta_pressure_pa)} Pa`;
                document.getElementById('thresholdValue').textContent=`幅度 ${fmt(data.breath_activity_amplitude_pa)} / 阈值 ${fmt(data.effective_breath_threshold_pa)} Pa`;
                document.getElementById('breathState').textContent=data.breath_state||'--';
                document.getElementById('lastBreathValue').textContent=`${data.assist_mode||'--'} · ${fmt(data.adaptive_apnea_seconds)}s · 距上次 ${fmt(data.last_breath_age_s)}s`;
                document.getElementById('environmentValue').textContent=data.humidity?`${fmt(data.humidity)}%`:'--';
                document.getElementById('environmentActivity').textContent=`湿度 ${fmt(data.humidity_activity)}% · 温度 ${fmt(data.temperature_activity,2)}C`;
                document.getElementById('spo2Value').textContent=data.spo2?`${fmt(data.spo2)}%`:(data.spo2_status||'--');
                document.getElementById('hrValue').textContent=data.heart_rate?`心率 ${fmt(data.heart_rate,0)} bpm`:`心率 -- (${data.spo2_status||''})`;
                document.getElementById('servoState').textContent=data.servo_state||'--';
                document.getElementById('pumpCountValue').textContent=`手动测试 ${data.pump_test_count||0} 次`;
                document.getElementById('pressureValue').textContent=`当前气压 ${fmt(data.pressure_pa,2)} Pa`;
                document.getElementById('baselineValue').textContent=`基准气压 ${fmt(data.baseline_pressure_pa,2)} Pa`;

                const history=data.history.pressure||[];
                chart.setOption({xAxis:{data:history.map(i=>new Date(i.ts*1000).toLocaleTimeString())},series:[{data:history.map(i=>i.delta_pressure_pa),markLine:{data:[{yAxis:data.effective_breath_threshold_pa,name:'+'},{yAxis:-data.effective_breath_threshold_pa,name:'-'},{yAxis:0,name:'基准'}]}}]});
            } else {
                document.getElementById('fallStatus').textContent=data.fall_detected?'跌倒!':'正常';
                document.getElementById('fallStatus').style.color=data.fall_detected?'var(--bad)':'var(--ok)';
                document.getElementById('fallAngle').textContent=`角度 ${data.fall_angle!=null?data.fall_angle:'--'}`;
                document.getElementById('fallAlarm').textContent=data.fall_detected?'报警中':'正常';
                document.getElementById('fallAlarm').style.color=data.fall_detected?'var(--bad)':'var(--ok)';
                document.getElementById('fallCount').textContent=`连续帧 ${data.fall_count||0}`;
                document.getElementById('cameraStatus').textContent=data.fall_status||'--';
            }

            const badge=document.getElementById('alarmBadge');
            if(data.alarms&&data.alarms.length){badge.textContent=data.alarms.join(', ');badge.style.color='var(--bad)';badge.style.borderColor='rgba(180,35,24,.35)';badge.style.background='rgba(180,35,24,.08)';}
            else{badge.textContent='无报警';badge.style.color='var(--ok)';badge.style.borderColor='rgba(31,138,91,.35)';badge.style.background='rgba(31,138,91,.08)';}

            renderHardware(data.hardware);
            renderLogs(data.history.events);
        }

        async function loadData(){const r=await fetch('/data');renderData(await r.json());}
        async function loadConfig(){
            const r=await fetch('/config');const cfg=await r.json();
            for(const f of allFields){const el=document.getElementById(f);if(el&&cfg[f]!=null)el.value=cfg[f];}
        }
        async function postJson(url,body={}){return(await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();}

        document.getElementById('saveConfig').addEventListener('click',async()=>{
            const payload={};
            const fields=currentMode==='night'?nightFields:dayFields;
            for(const f of fields){const el=document.getElementById(f);if(el)payload[f]=el.value;}
            await postJson('/config',payload);await loadConfig();
        });
        document.getElementById('calibrate').addEventListener('click',()=>postJson('/calibrate'));
        document.getElementById('pumpTest').addEventListener('click',()=>postJson('/pump_test'));
        document.getElementById('ledTest').addEventListener('click',()=>postJson('/led_test',{seconds:1}));

        document.getElementById('modeToggle').addEventListener('change',async(e)=>{
            const newMode=e.target.checked?'night':'day';
            await postJson('/mode',{system_mode:newMode});
            await loadData();await loadConfig();
        });

        window.addEventListener('resize',()=>chart.resize());
        loadConfig();loadData();setInterval(loadData,500);
    </script>
</body>
</html>
