<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵息 Phase 1 硬件调试台架</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #f3f6f8;
            --panel: #ffffff;
            --ink: #172026;
            --muted: #64727d;
            --line: #d7e0e7;
            --accent: #007c89;
            --accent-2: #c2542d;
            --ok: #1f8a5b;
            --warn: #b46a00;
            --bad: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }

        header {
            border-bottom: 1px solid var(--line);
            background: #ffffff;
        }

        .topbar {
            width: min(1280px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 18px 0 14px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        .mode-badge {
            min-width: 170px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 10px;
            background: #f8fafb;
            text-align: right;
            font-size: 13px;
            color: var(--muted);
        }

        .mode-badge strong {
            display: block;
            color: var(--ink);
            font-size: 16px;
            margin-top: 2px;
        }

        main {
            width: min(1280px, calc(100vw - 32px));
            margin: 18px auto 28px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 16px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            min-width: 0;
        }

        .panel-header {
            min-height: 44px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .panel-title {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
        }

        .panel-body {
            padding: 14px;
        }

        .chart-panel {
            min-height: 460px;
        }

        #pressureChart {
            width: 100%;
            height: 390px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            min-height: 92px;
        }

        .metric label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .metric strong {
            display: block;
            font-size: 26px;
            line-height: 1.1;
        }

        .metric span {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
        }

        .status-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 13px;
            border: 1px solid var(--line);
            background: #f8fafb;
        }

        .pill.ok {
            color: var(--ok);
            border-color: rgba(31, 138, 91, 0.35);
            background: rgba(31, 138, 91, 0.08);
        }

        .pill.warn {
            color: var(--warn);
            border-color: rgba(180, 106, 0, 0.35);
            background: rgba(180, 106, 0, 0.09);
        }

        .pill.bad {
            color: var(--bad);
            border-color: rgba(180, 35, 24, 0.35);
            background: rgba(180, 35, 24, 0.08);
        }

        .side {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            color: var(--muted);
            font-size: 12px;
        }

        input {
            width: 100%;
            height: 34px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 14px;
            background: #fff;
            color: var(--ink);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        button {
            height: 36px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: #ffffff;
            color: var(--accent);
        }

        button.warning {
            border-color: var(--accent-2);
            background: var(--accent-2);
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .logs {
            max-height: 250px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-item {
            border-left: 3px solid var(--line);
            padding: 2px 0 2px 9px;
            font-size: 13px;
        }

        .log-item.warning {
            border-left-color: var(--warn);
        }

        .log-item.error {
            border-left-color: var(--bad);
        }

        .log-time {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 2px;
        }

        .hardware-list {
            display: grid;
            gap: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        .hardware-list strong {
            color: var(--ink);
        }

        @media (max-width: 980px) {
            main {
                grid-template-columns: 1fr;
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .mode-badge {
                width: 100%;
                text-align: left;
            }
        }

        @media (max-width: 560px) {
            .cards,
            .form-grid,
            .actions,
            .status-row {
                grid-template-columns: 1fr;
            }

            #pressureChart {
                height: 330px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="topbar">
            <div>
                <h1>灵息 Phase 1 硬件调试台架</h1>
                <div class="subtitle">建议传感器夹在氧气面罩呼气孔外侧；使用压差 + 湿度 + 温度活动判断呼吸。</div>
            </div>
            <div class="mode-badge">
                当前模式
                <strong id="modeValue">--</strong>
            </div>
        </div>
    </header>

    <main>
        <section>
            <div class="cards">
                <div class="metric">
                    <label>压差</label>
                    <strong id="deltaValue">--</strong>
                    <span id="thresholdValue">阈值 -- Pa</span>
                </div>
                <div class="metric">
                    <label>呼吸状态</label>
                    <strong id="breathState">--</strong>
                    <span id="lastBreathValue">距上次 -- s</span>
                </div>
                <div class="metric">
                    <label>AHT20 温湿度</label>
                    <strong id="environmentValue">--</strong>
                    <span id="environmentActivity">环境传感器 --</span>
                </div>
                <div class="metric">
                    <label>舵机</label>
                    <strong id="servoState">--</strong>
                    <span id="pumpCountValue">手动测试 0 次</span>
                </div>
            </div>

            <div class="panel chart-panel">
                <div class="panel-header">
                    <h2 class="panel-title">BMP280 压差波形</h2>
                    <div id="alarmBadge" class="pill ok">无报警</div>
                </div>
                <div class="panel-body">
                    <div id="pressureChart"></div>
                    <div class="status-row">
                        <div class="pill" id="pressureValue">当前气压 -- Pa</div>
                        <div class="pill" id="baselineValue">基准气压 -- Pa</div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="side">
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">控制与参数</h2>
                </div>
                <div class="panel-body">
                    <div class="form-grid">
                        <div class="field">
                            <label for="min_breath_activity_pa">活动阈值 Pa</label>
                            <input id="min_breath_activity_pa" type="number" step="0.5">
                        </div>
                        <div class="field">
                            <label for="humidity_activity_threshold">湿度上升阈值 %</label>
                            <input id="humidity_activity_threshold" type="number" step="0.1">
                        </div>
                        <div class="field">
                            <label for="temperature_activity_threshold">温度上升阈值 C</label>
                            <input id="temperature_activity_threshold" type="number" step="0.01">
                        </div>
                        <div class="field">
                            <label for="cooldown_seconds">冷却时间 s</label>
                            <input id="cooldown_seconds" type="number" step="0.1">
                        </div>
                        <div class="field">
                            <label for="breath_window_seconds">活动窗口 s</label>
                            <input id="breath_window_seconds" type="number" step="0.5">
                        </div>
                        <div class="field">
                            <label for="apnea_min_seconds">暂停最短 s</label>
                            <input id="apnea_min_seconds" type="number" step="0.5">
                        </div>
                        <div class="field">
                            <label for="apnea_max_seconds">暂停上限 s</label>
                            <input id="apnea_max_seconds" type="number" step="0.5" max="15">
                        </div>
                        <div class="field">
                            <label for="assist_interval_seconds">泵气间隔 s</label>
                            <input id="assist_interval_seconds" type="number" step="0.5">
                        </div>
                        <div class="field">
                            <label for="pump_artifact_ignore_seconds">泵后屏蔽 s</label>
                            <input id="pump_artifact_ignore_seconds" type="number" step="0.1">
                        </div>
                        <div class="field">
                            <label for="post_pump_recovery_seconds">恢复观察 s</label>
                            <input id="post_pump_recovery_seconds" type="number" step="0.5">
                        </div>
                        <div class="field">
                            <label for="servo_rest_angle">舵机复位角</label>
                            <input id="servo_rest_angle" type="number" step="1">
                        </div>
                        <div class="field">
                            <label for="servo_press_angle">舵机压下角</label>
                            <input id="servo_press_angle" type="number" step="1">
                        </div>
                    </div>
                    <div class="actions">
                        <button id="saveConfig">保存参数</button>
                        <button id="calibrate" class="secondary">重新校准</button>
                        <button id="pumpTest" class="warning">手动泵气测试</button>
                        <button id="ledTest" class="secondary">LED 测试</button>
                        <button id="refreshConfig" class="secondary">读取参数</button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">硬件连接</h2>
                </div>
                <div class="panel-body">
                    <div class="hardware-list" id="hardwareList"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">事件日志</h2>
                </div>
                <div class="panel-body">
                    <div class="logs" id="logs"></div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const chart = echarts.init(document.getElementById('pressureChart'));
        const configFields = [
            'min_breath_activity_pa',
            'humidity_activity_threshold',
            'temperature_activity_threshold',
            'breath_window_seconds',
            'cooldown_seconds',
            'apnea_min_seconds',
            'apnea_max_seconds',
            'assist_interval_seconds',
            'pump_artifact_ignore_seconds',
            'post_pump_recovery_seconds',
            'servo_rest_angle',
            'servo_press_angle'
        ];

        const chartOption = {
            animation: false,
            tooltip: { trigger: 'axis' },
            grid: { left: 54, right: 20, top: 24, bottom: 42 },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                axisLabel: { color: '#64727d' },
                axisLine: { lineStyle: { color: '#d7e0e7' } },
                data: []
            },
            yAxis: {
                type: 'value',
                name: 'Pa',
                axisLabel: { color: '#64727d' },
                splitLine: { lineStyle: { color: '#e7edf2' } }
            },
            series: [
                {
                    name: '压差',
                    type: 'line',
                    data: [],
                    smooth: true,
                    showSymbol: false,
                    lineStyle: { color: '#007c89', width: 2 },
                    areaStyle: { color: 'rgba(0, 124, 137, 0.10)' },
                    markLine: {
                        silent: true,
                        symbol: 'none',
                        data: []
                    }
                }
            ]
        };
        chart.setOption(chartOption);

        function fmt(value, digits = 1) {
            return value === null || value === undefined ? '--' : Number(value).toFixed(digits);
        }

        function setButtonBusy(button, busy) {
            button.disabled = busy;
        }

        function alarmClass(alarms) {
            if (!alarms || alarms.length === 0) return 'pill ok';
            if (alarms.some(item => item.includes('error') || item.includes('power'))) return 'pill bad';
            return 'pill warn';
        }

        function renderHardware(hardware) {
            const pins = hardware.gpio_pins || {};
            document.getElementById('hardwareList').innerHTML = `
                <div><strong>传感器：</strong>${hardware.pressure_sensor}</div>
                <div><strong>温湿度：</strong>${hardware.environment_sensor || 'not configured'}</div>
                <div><strong>MAX30102：</strong>${hardware.pulse_oximeter}</div>
                <div><strong>舵机：</strong>${hardware.servo}</div>
                <div><strong>LED：</strong>${hardware.led}</div>
                <div><strong>GPIO：</strong>LED ${pins.led}, Servo ${pins.servo}, SDA ${pins.i2c_sda}, SCL ${pins.i2c_scl}</div>
            `;
        }

        function renderLogs(events) {
            const logs = document.getElementById('logs');
            const rows = (events || []).slice(-24).reverse().map(item => {
                const time = new Date(item.ts * 1000).toLocaleTimeString();
                return `
                    <div class="log-item ${item.level}">
                        <div class="log-time">${time} · ${item.kind}</div>
                        <div>${item.message}</div>
                    </div>
                `;
            });
            logs.innerHTML = rows.join('') || '<div class="log-item"><div>暂无事件</div></div>';
        }

        function renderData(data) {
            document.getElementById('modeValue').textContent = data.mode || '--';
            document.getElementById('deltaValue').textContent = `${fmt(data.delta_pressure_pa)} Pa`;
            document.getElementById('thresholdValue').textContent = `幅度 ${fmt(data.breath_activity_amplitude_pa)} / 阈值 ${fmt(data.effective_breath_threshold_pa)} Pa`;
            document.getElementById('breathState').textContent = data.breath_state || '--';
            document.getElementById('lastBreathValue').textContent = `${data.assist_mode || '--'} · ${fmt(data.adaptive_apnea_seconds)}s 判定 · 距上次 ${fmt(data.last_breath_age_s)}s`;
            document.getElementById('environmentValue').textContent = data.humidity ? `${fmt(data.humidity)}%` : '--';
            document.getElementById('environmentActivity').textContent =
                `湿度幅度 ${fmt(data.humidity_activity)}% · 温度幅度 ${fmt(data.temperature_activity, 2)}C`;
            document.getElementById('servoState').textContent = data.servo_state || '--';
            document.getElementById('pumpCountValue').textContent = `手动测试 ${data.pump_test_count || 0} 次`;
            document.getElementById('pressureValue').textContent = `当前气压 ${fmt(data.pressure_pa, 2)} Pa`;
            document.getElementById('baselineValue').textContent = `基准气压 ${fmt(data.baseline_pressure_pa, 2)} Pa`;

            const alarmBadge = document.getElementById('alarmBadge');
            alarmBadge.className = alarmClass(data.alarms);
            alarmBadge.textContent = data.alarms && data.alarms.length ? data.alarms.join(', ') : '无报警';

            const history = data.history.pressure || [];
            const x = history.map(item => new Date(item.ts * 1000).toLocaleTimeString());
            const y = history.map(item => item.delta_pressure_pa);
            chart.setOption({
                xAxis: { data: x },
                series: [{
                    data: y,
                    markLine: {
                        data: [
                            { yAxis: data.effective_breath_threshold_pa, name: '正向活动阈值' },
                            { yAxis: -data.effective_breath_threshold_pa, name: '负向活动阈值' },
                            { yAxis: 0, name: '基准' }
                        ]
                    }
                }]
            });

            renderHardware(data.hardware);
            renderLogs(data.history.events);
        }

        async function loadData() {
            const response = await fetch('/data');
            renderData(await response.json());
        }

        async function loadConfig() {
            const response = await fetch('/config');
            const cfg = await response.json();
            for (const field of configFields) {
                document.getElementById(field).value = cfg[field];
            }
        }

        async function postJson(url, body = {}) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return response.json();
        }

        document.getElementById('saveConfig').addEventListener('click', async event => {
            const button = event.currentTarget;
            setButtonBusy(button, true);
            const payload = {};
            for (const field of configFields) {
                payload[field] = document.getElementById(field).value;
            }
            await postJson('/config', payload);
            await loadConfig();
            setButtonBusy(button, false);
        });

        document.getElementById('calibrate').addEventListener('click', async event => {
            const button = event.currentTarget;
            setButtonBusy(button, true);
            await postJson('/calibrate');
            setButtonBusy(button, false);
        });

        document.getElementById('pumpTest').addEventListener('click', async event => {
            const button = event.currentTarget;
            setButtonBusy(button, true);
            await postJson('/pump_test');
            setButtonBusy(button, false);
        });

        document.getElementById('ledTest').addEventListener('click', async event => {
            const button = event.currentTarget;
            setButtonBusy(button, true);
            await postJson('/led_test', { seconds: 1 });
            setButtonBusy(button, false);
        });

        document.getElementById('refreshConfig').addEventListener('click', loadConfig);
        window.addEventListener('resize', () => chart.resize());

        loadConfig();
        loadData();
        setInterval(loadData, 250);
    </script>
</body>
</html>
